<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warenkorb – NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#000;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:800;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}

h1{
  margin-bottom:25px;
}

.cart{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.item{
  display:flex;
  gap:20px;
  align-items:center;
  padding:20px 0;
  border-bottom:1px solid #eee;
}

.item img{
  width:110px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
}

.info{
  flex:1;
}

.info h2{
  margin-bottom:8px;
}

.info p{
  color:#666;
  margin:4px 0;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
}

.quantity button{
  width:32px;
  height:32px;
  border:1px solid #ddd;
  background:white;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

.remove{
  border:none;
  background:#eee;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
}

.price{
  font-weight:bold;
  min-width:90px;
  text-align:right;
}

.summary{
  margin-top:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:20px;
}

.total{
  font-size:24px;
  font-weight:800;
}

.checkout{
  background:#000;
  color:white;
  border:none;
  padding:16px 28px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.checkout:hover{
  background:#222;
}

.empty{
  text-align:center;
  padding:50px 20px;
}

.empty p{
  color:#666;
  margin:15px 0 25px;
}

.shop{
  display:inline-block;
  background:#000;
  color:white;
  padding:13px 22px;
  border-radius:9px;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:700px){
  .item{
    align-items:flex-start;
  }

  .item img{
    width:80px;
    height:100px;
  }

  .price{
    min-width:auto;
  }

  .summary{
    flex-direction:column;
    align-items:stretch;
  }

  .checkout{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NovaShop</div>
  <a href="index.html">← Zum Shop</a>
</header>

<div class="container">

  <h1>🛒 Dein Warenkorb</h1>

  <div class="cart" id="cart"></div>

</div>

<script>

function getCart(){
  return JSON.parse(localStorage.getItem("cart") || "[]");
}

function saveCart(cart){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function renderCart(){

  const cart = getCart();
  const container = document.getElementById("cart");

  if(cart.length === 0){

    container.innerHTML = `
      <div class="empty">
        <h2>Dein Warenkorb ist leer</h2>
        <p>Füge Produkte hinzu, um sie hier zu sehen.</p>
        <a class="shop" href="index.html">Jetzt shoppen</a>
      </div>
    `;

    return;
  }

  let total = 0;

  container.innerHTML = cart.map((item,index)=>{

    const quantity = item.quantity || 1;
    const price = Number(item.price) || 0;
    const itemTotal = price * quantity;

    total += itemTotal;

    return `
      <div class="item">

        <img src="${item.image}" alt="${item.name}">

        <div class="info">
          <h2>${item.name}</h2>
          ${item.size ? `<p>Größe: ${item.size}</p>` : ""}
          <p>${price.toFixed(2)} €</p>

          <div class="quantity">
            <button onclick="changeQuantity(${index}, -1)">−</button>
            <strong>${quantity}</strong>
            <button onclick="changeQuantity(${index}, 1)">+</button>
          </div>
        </div>

        <div class="price">
          ${itemTotal.toFixed(2)} €
        </div>

        <button class="remove" onclick="removeItem(${index})">
          Entfernen
        </button>

      </div>
    `;

  }).join("") + `

    <div class="summary">

      <div class="total">
        Gesamt: ${total.toFixed(2)} €
      </div>

      <button class="checkout" onclick="checkout()">
        Zur Kasse →
      </button>

    </div>
  `;
}

function changeQuantity(index, amount){

  const cart = getCart();

  cart[index].quantity = (cart[index].quantity || 1) + amount;

  if(cart[index].quantity <= 0){
    cart.splice(index,1);
  }

  saveCart(cart);
  renderCart();
}

function removeItem(index){

  const cart = getCart();

  cart.splice(index,1);

  saveCart(cart);
  renderCart();
}

function checkout(){

  alert("Checkout kommt als Nächstes! 🛒");

}

renderCart();

</script>

</body>
</html>
