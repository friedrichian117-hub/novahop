<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produkt – NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#000;
  color:white;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:40px auto;
  padding:20px;
}

.product{
  background:white;
  border-radius:20px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

/* BILDER */

.gallery{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.main-image{
  width:100%;
  height:500px;
  object-fit:cover;
  border-radius:16px;
  background:#eee;
}

.thumbnails{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.thumbnails img{
  width:80px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
}

.thumbnails img:hover{
  border-color:#000;
}

/* INFO */

.info{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.badge{
  display:inline-block;
  background:#000;
  color:white;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  width:max-content;
  margin-bottom:15px;
}

h1{
  font-size:38px;
  margin-bottom:12px;
}

.price{
  font-size:28px;
  font-weight:900;
  margin:15px 0;
}

.description{
  color:#666;
  line-height:1.6;
  margin-bottom:25px;
}

/* GRÖSSE */

.label{
  font-weight:bold;
  margin-bottom:10px;
}

.sizes{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.size{
  border:1px solid #ccc;
  background:white;
  padding:12px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.size:hover{
  border-color:#000;
}

.size.selected{
  background:#000;
  color:white;
  border-color:#000;
}

/* MENGE */

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.quantity button{
  width:38px;
  height:38px;
  border:1px solid #ccc;
  background:white;
  border-radius:8px;
  font-size:20px;
  cursor:pointer;
}

.quantity span{
  font-weight:bold;
  font-size:18px;
}

/* BUTTON */

.add{
  width:100%;
  padding:17px;
  background:#000;
  color:white;
  border:none;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.add:hover{
  background:#222;
}

.cart-link{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#111;
  font-weight:bold;
  text-decoration:none;
}

/* MOBILE */

@media(max-width:750px){

  .product{
    grid-template-columns:1fr;
    padding:20px;
  }

  .main-image{
    height:400px;
  }

  h1{
    font-size:30px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    NovaShop
  </div>

        id="thumbnails"
        class="thumbnails">
      </div>

    </div>


    <!-- PRODUKTINFO -->

      </h1>

      <div
        id="productPrice"

      </div>

      <p

      </p>


      <div class="label">
        Größe:

      <div
        id="sizes"

      <div class="label">
        Menge:
      </div>

      <div class="quantity">

        <button onclick="changeQuantity(-1)">
          −
        </button>

        <span id="quantity">

        <button onclick="changeQuantity(1)">
          +

      <button

      <a
        class="cart-link"
        href="cart.html">

</div>

/* =========================
   PRODUKT AUS URL HOLEN
========================= */

const params = new URLSearchParams(window.location.search);

const productId = Number(params.get("id"));

const product = products.find(
  p => p.id === productId

========================= */

========================= */

if(!product){

  document.querySelector(".container").innerHTML = `
    <div style="
      background:white;
      padding:50px;
      border-radius:20px;
      text-align:center;
    ">
      <h1>Produkt nicht gefunden</h1>
      <br>
      <a href="index.html">
        Zurück zum Shop
      </a>
    </div>
  `;

}else{

  document.getElementById("productName").textContent =
    product.name;

  document.getElementById("productPrice").textContent =
    product.price.toFixed(2) + " €";

  document.getElementById("description").textContent =
    "Hochwertiges Produkt von NovaShop. Modernes Design und angenehmer Tragekomfort.";

  document.getElementById("mainImage").src =
    product.images[0];


  /* BILDER */

  const thumbnails =
    document.getElementById("thumbnails");

  product.images.forEach((image,index)=>{

    const img = document.createElement("img");

    img.src = image;

    img.onclick = function(){

      document.getElementById("mainImage").src =
        image;

    };

    thumbnails.appendChild(img);

  });


  /* GRÖSSEN */

  const sizes =
    document.getElementById("sizes");

  if(product.sizes.length === 0){

    sizes.innerHTML =
      "<p style='color:#666'>Keine Größenauswahl nötig</p>";

  }else{

    product.sizes.forEach(size=>{

      const button =
        document.createElement("button");

      button.className = "size";

      button.textContent = size;

      button.onclick = function(){

        document
          .querySelectorAll(".size")
          .forEach(b =>
            b.classList.remove("selected")
          );

        button.classList.add("selected");

        selectedSize = size;

      };

      sizes.appendChild(button);

    });

  }

}
