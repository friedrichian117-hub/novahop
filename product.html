<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkt – NovaShop</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f7;color:#111}
header{background:white;border-bottom:1px solid #ddd}
.nav{max-width:1200px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;color:#111;text-decoration:none}
.nav a{background:#111;color:white;text-decoration:none;padding:11px 15px;border-radius:10px;font-weight:bold}

.product-page{max-width:1100px;margin:40px auto;padding:0 20px}
.product-box{background:white;border-radius:18px;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:35px}
.main-image{width:100%;height:500px;object-fit:cover;border-radius:15px;background:#eee}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumb{width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.thumb.active{border-color:#111}

.category{color:#777;font-size:13px;text-transform:uppercase;font-weight:bold}
h1{font-size:36px;margin:8px 0}
.rating{margin:10px 0}
.price{font-size:28px;font-weight:900;margin:15px 0}

.shipping-info{
background:#f5f5f5;
padding:16px;
border-radius:12px;
line-height:1.8;
margin:20px 0;
}

.size-title{font-weight:bold;margin-bottom:10px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.size{padding:11px 17px;background:#eee;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.size.selected{background:#111;color:white}

.quantity{display:flex;align-items:center;gap:12px;margin:20px 0}
.quantity button{width:35px;height:35px;border:none;border-radius:7px;background:#eee;font-size:20px;cursor:pointer}
.quantity span{font-weight:bold}

.add{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#111;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
}
.add:hover{background:#333}

@media(max-width:750px){
.product-box{grid-template-columns:1fr}
.main-image{height:350px}
h1{font-size:28px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<a href="index.html" class="logo">NovaShop</a>
<a href="cart.html">🛒 Warenkorb</a>
</div>
</header>

<div class="product-page">
<div class="product-box">

<div>
<img id="mainImage" class="main-image">

<div id="thumbs" class="thumbs"></div>
</div>

<div>

<div id="category" class="category"></div>
<h1 id="name"></h1>
<div id="rating" class="rating"></div>
<div id="price" class="price"></div>

<div class="shipping-info">
🚚 <strong>Versand:</strong> 4,99 €<br>
🎁 Kostenloser Versand ab 50 €<br>
📦 <strong>Lieferzeit:</strong> 2–4 Werktage
</div>

<div id="sizeArea">
<div class="size-title">Größe auswählen:</div>
<div id="sizes" class="sizes"></div>
</div>

<div class="quantity">
<button onclick="changeQuantity(-1)">−</button>
<span id="quantity">1</span>
<button onclick="changeQuantity(1)">+</button>
</div>

<button class="add" onclick="addToCart()">
In den Warenkorb
</button>

</div>

</div>
</div>

<script>

const products = [

{
id:1,
name:"Nova Black Hoodie",
price:39.99,
category:"Kleidung",
sizes:["XS","S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80"
],
rating:4.8
},

{
id:2,
name:"Nova Grey Hoodie",
price:44.99,
category:"Kleidung",
sizes:["XS","S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=80"
],
rating:4.7
},

{
id:3,
name:"Nova Streetwear Hoodie",
price:49.99,
category:"Kleidung",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=800&q=80"
],
rating:4.9
},

{
id:4,
name:"Nova Cream Hoodie",
price:39.99,
category:"Kleidung",
sizes:["XS","S","M","L","XL"],
images:[
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=800&q=80"
],
rating:4.6
},

{
id:5,
name:"Nova Green Hoodie",
price:44.99,
category:"Kleidung",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=800&q=80"
],
rating:4.8
},

{
id:6,
name:"Nova Zip Hoodie",
price:54.99,
category:"Kleidung",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80"
],
rating:4.9
},

{
id:7,
name:"Nova Wireless Headphones",
price:59.99,
category:"Elektronik",
sizes:[],
images:[
"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
],
rating:4.7
},

{
id:8,
name:"Nova Smartwatch",
price:79.99,
category:"Elektronik",
sizes:[],
images:[
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1000&q=80",
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80"
],
rating:4.6
}

];

const id = Number(new URLSearchParams(location.search).get("id")) || 1;
const product = products.find(p => p.id === id) || products[0];

let quantity = 1;
let selectedSize = "";

document.getElementById("name").textContent = product.name;
document.getElementById("category").textContent = product.category;
document.getElementById("price").textContent =
product.price.toFixed(2).replace(".",",") + " €";

document.getElementById("rating").textContent =
"★".repeat(Math.floor(product.rating)) +
"☆".repeat(5-Math.floor(product.rating)) +
" " + product.rating;


document.getElementById("mainImage").src = product.images[0];

const thumbs = document.getElementById("thumbs");

product.images.forEach((image,index)=>{
const img=document.createElement("img");
img.src=image;
img.className="thumb"+(index===0?" active":"");

img.onclick=()=>{
document.getElementById("mainImage").src=image;
document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
img.classList.add("active");
};

thumbs.appendChild(img);
});


const sizes=document.getElementById("sizes");

if(product.sizes.length===0){

document.getElementById("sizeArea").style.display="none";

}else{

product.sizes.forEach(size=>{

const button=document.createElement("button");
button.className="size";
button.textContent=size;

button.onclick=()=>{
selectedSize=size;
document.querySelectorAll(".size").forEach(x=>x.classList.remove("selected"));
button.classList.add("selected");
};

sizes.appendChild(button);

});

}


function changeQuantity(amount){

quantity+=amount;

if(quantity<1) quantity=1;

document.getElementById("quantity").textContent=quantity;

}


function addToCart(){

if(product.sizes.length>0 && !selectedSize){

alert("Bitte wähle zuerst eine Größe aus.");
return;

}

let cart=JSON.parse(localStorage.getItem("cart")) || [];

const existing=cart.find(item=>
item.id===product.id &&
item.size===selectedSize
);

if(existing){

existing.quantity+=quantity;

}else{

cart.push({
id:product.id,
name:product.name,
price:product.price,
image:product.images[0],
size:selectedSize,
quantity:quantity
});

}

localStorage.setItem("cart",JSON.stringify(cart));

window.location.href="cart.html";

}

</script>

</body>
</html>
