<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkt – NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#000;
  color:white;
  padding:20px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:800;
}

header a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}

.product{
  background:white;
  border-radius:20px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  box-shadow:0 5px 30px rgba(0,0,0,.08);
}

/* BILDER */

.gallery{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.main-image{
  width:100%;
  height:550px;
  object-fit:cover;
  border-radius:15px;
  background:#eee;
}

.thumbnails{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.thumbnail{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
}

.thumbnail:hover{
  border-color:#000;
}

/* PRODUKT INFO */

.info{
  padding:10px 0;
}

.badge{
  display:inline-block;
  background:#000;
  color:white;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  font-size:40px;
  margin-bottom:15px;
}

.description{
  color:#666;
  line-height:1.6;
  margin-bottom:20px;
}

.price{
  font-size:30px;
  font-weight:800;
  margin-bottom:25px;
}

/* GRÖSSEN */

.label{
  font-weight:bold;
  margin-bottom:12px;
}

.sizes{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.size{
  min-width:55px;
  padding:13px 18px;
  background:white;
  border:1px solid #ccc;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.size:hover{
  border-color:#000;
}

.size.selected{
  background:#000;
  color:white;
  border-color:#000;
}

/* MENGE */

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.quantity button{
  width:38px;
  height:38px;
  border:1px solid #ccc;
  background:white;
  border-radius:8px;
  cursor:pointer;
  font-size:20px;
}

.quantity span{
  font-weight:bold;
  font-size:18px;
}

/* WARENKORB */

.add{
  width:100%;
  padding:18px;
  background:#000;
  color:white;
  border:none;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.add:hover{
  background:#222;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#555;
  text-decoration:none;
}

.back:hover{
  text-decoration:underline;
}

@media(max-width:800px){

  .product{
    grid-template-columns:1fr;
    padding:20px;
  }

  .main-image{
    height:400px;
  }

  h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NovaShop</div>
  <a href="cart.html">🛒 Warenkorb</a>
</header>

<div class="container">

  <div class="product">

    <!-- BILDER -->
    <div class="gallery">

      <img id="mainImage" class="main-image" src="" alt="Produkt">

      <div class="thumbnails" id="thumbnails"></div>

    </div>

    <!-- PRODUKT -->
    <div class="info">

      <span class="badge">NOVA COLLECTION</span>

      <h1 id="productName">Produkt</h1>

      <p class="description" id="description"></p>

      <div class="price" id="price"></div>

      <div class="label">Größe auswählen:</div>

      <div class="sizes" id="sizes"></div>

      <div class="label">Menge:</div>

      <div class="quantity">
        <button onclick="changeQuantity(-1)">−</button>
        <span id="quantity">1</span>
        <button onclick="changeQuantity(1)">+</button>
      </div>

      <button class="add" onclick="addToCart()">
        In den Warenkorb 🛒
      </button>

      <a class="back" href="index.html">
        ← Zurück zum Shop
      </a>

    </div>

  </div>

</div>

<script>

/* PRODUKTE */

const products = [

  {
    id:1,
    name:"Nova Black Hoodie",
    price:39.99,
    description:"Moderner schwarzer Nova Hoodie mit cleanem Streetwear-Look.",
    sizes:["XS","S","M","L","XL","XXL"],
    images:[
      "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:2,
    name:"Nova Grey Hoodie",
    price:44.99,
    description:"Grauer Hoodie für einen modernen und lässigen Look.",
    sizes:["XS","S","M","L","XL","XXL"],
    images:[
      "https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:3,
    name:"Nova Streetwear Hoodie",
    price:49.99,
    description:"Oversized Streetwear Hoodie im Nova Style.",
    sizes:["S","M","L","XL","XXL"],
    images:[
      "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1509942774463-acf339cf87d5?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:4,
    name:"Nova Cream Hoodie",
    price:39.99,
    description:"Heller Cream Hoodie mit schlichtem Premium-Look.",
    sizes:["XS","S","M","L","XL"],
    images:[
      "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:5,
    name:"Nova Green Hoodie",
    price:44.99,
    description:"Dunkelgrüner Hoodie für einen auffälligen Nova Look.",
    sizes:["S","M","L","XL","XXL"],
    images:[
      "https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1509942774463-acf339cf87d5?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:6,
    name:"Nova Zip Hoodie",
    price:54.99,
    description:"Stylischer Zip Hoodie mit modernem Streetwear-Schnitt.",
    sizes:["S","M","L","XL","XXL"],
    images:[
      "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:7,
    name:"Nova Wireless Headphones",
    price:59.99,
    description:"Kabellose Kopfhörer mit modernem Design.",
    sizes:[],
    images:[
      "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&w=1000&q=80"
    ]
  },

  {
    id:8,
    name:"Nova Smartwatch",
    price:79.99,
    description:"Moderne Smartwatch für deinen Alltag.",
    sizes:[],
    images:[
      "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=1000&q=80"
    ]
  }

];


/* PRODUKT AUS URL LADEN */

const params = new URLSearchParams(window.location.search);

const productId = Number(params.get("id"));

const product = products.find(p => p.id === productId) || products[0];

let selectedSize = "";
let quantity = 1;


/* PRODUKT ANZEIGEN */

document.getElementById("productName").textContent = product.name;

document.getElementById("price").textContent =
  product.price.toFixed(2) + " €";

document.getElementById("description").textContent =
  product.description;


/* HAUPTBILD */

document.getElementById("mainImage").src = product.images[0];


/* THUMBNAILS */

const thumbnails = document.getElementById("thumbnails");

product.images.forEach((image) => {

  const img = document.createElement("img");

  img.src = image;
  img.className = "thumbnail";

  img.onclick = function(){
    document.getElementById("mainImage").src = image;
  };

  thumbnails.appendChild(img);

});


/* GRÖSSEN */

const sizesContainer = document.getElementById("sizes");

if(product.sizes.length === 0){

  sizesContainer.innerHTML =
    "<p style='color:#666'>Keine Größe erforderlich</p>";

}else{

  product.sizes.forEach(size => {

    const button = document.createElement("button");

    button.className = "size";
    button.textContent = size;

    button.onclick = function(){

      selectedSize = size;

      document.querySelectorAll(".size").forEach(btn => {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");

    };

    sizesContainer.appendChild(button);

  });

}


/* MENGE */

function changeQuantity(amount){

  quantity += amount;

  if(quantity < 1){
    quantity = 1;
  }

  document.getElementById("quantity").textContent = quantity;

}


/* IN WARENKORB */

function addToCart(){

  if(product.sizes.length > 0 && selectedSize === ""){

    alert("Bitte wähle zuerst eine Größe aus.");

    return;
  }


  let cart = JSON.parse(
    localStorage.getItem("cart") || "[]"
  );


  /* Prüfen, ob Produkt mit gleicher Größe bereits existiert */

  const existing = cart.find(item =>
    item.id === product.id &&
    item.size === selectedSize
  );


  if(existing){

    existing.quantity =
      (existing.quantity || 1) + quantity;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      size:selectedSize,

      image:product.images[0],

      quantity:quantity

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  window.location.href = "cart.html";

}

</script>

</body>
</html>
