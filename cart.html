<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaShop – Warenkorb</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f6;
  color:#111;
}

/* HEADER */

header{
  background:white;
  border-bottom:1px solid #ddd;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:900;
}

.back{
  background:#111;
  color:white;
  text-decoration:none;
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
}

/* CONTAINER */

.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px 60px;
}

h1{
  font-size:36px;
  margin-bottom:25px;
}

/* LAYOUT */

.cart-layout{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:25px;
}

/* ARTIKEL */

.cart-box{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 6px 25px rgba(0,0,0,.06);
}

.cart-item{
  display:grid;
  grid-template-columns:110px 1fr auto;
  gap:18px;
  align-items:center;
  padding:20px 0;
  border-bottom:1px solid #eee;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-image{
  width:110px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

.item-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.item-size{
  color:#666;
  font-size:14px;
  margin-bottom:10px;
}

.item-price{
  font-weight:bold;
  font-size:17px;
}

/* MENGE */

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.quantity button{
  width:34px;
  height:34px;
  border:1px solid #ccc;
  background:white;
  border-radius:7px;
  cursor:pointer;
  font-size:18px;
  font-weight:bold;
}

.quantity button:hover{
  background:#f1f1f1;
}

.quantity span{
  width:30px;
  text-align:center;
  font-weight:bold;
}

/* RECHTS */

.item-right{
  text-align:right;
}

.item-total{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.remove{
  border:0;
  background:#eee;
  padding:8px 11px;
  border-radius:7px;
  cursor:pointer;
}

.remove:hover{
  background:#ddd;
}

/* ZUSAMMENFASSUNG */

.summary{
  background:white;
  border-radius:16px;
  padding:25px;
  height:max-content;
  box-shadow:0 6px 25px rgba(0,0,0,.06);
  position:sticky;
  top:20px;
}

.summary h2{
  margin-top:0;
  margin-bottom:25px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  color:#555;
}

.row.total{
  border-top:1px solid #ddd;
  padding-top:18px;
  margin-top:20px;
  color:#111;
  font-size:21px;
  font-weight:bold;
}

.shipping-free{
  color:#16833b;
  font-weight:bold;
}

.checkout{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:16px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.checkout:hover{
  background:#292929;
}

/* LEER */

.empty{
  text-align:center;
  padding:60px 20px;
}

.empty-icon{
  font-size:55px;
  margin-bottom:15px;
}

.empty h2{
  margin-bottom:10px;
}

.empty p{
  color:#666;
}

.shop-button{
  display:inline-block;
  margin-top:20px;
  background:#111;
  color:white;
  text-decoration:none;
  padding:13px 20px;
  border-radius:8px;
  font-weight:bold;
}

/* INFO */

.shipping-note{
  margin-top:18px;
  padding:15px;
  background:#f5f5f5;
  border-radius:9px;
  font-size:13px;
  color:#666;
  line-height:1.5;
}

/* MOBILE */

@media(max-width:800px){

  .cart-layout{
    grid-template-columns:1fr;
  }

  .summary{
    position:static;
  }

}

@media(max-width:600px){

  .nav{
    padding:15px;
  }

  .logo{
    font-size:22px;
  }

  .back{
    padding:9px 12px;
    font-size:13px;
  }

  h1{
    font-size:30px;
  }

  .cart-box{
    padding:15px;
  }

  .cart-item{
    grid-template-columns:80px 1fr;
    gap:12px;
  }

  .cart-image{
    width:80px;
    height:90px;
  }

  .item-right{
    grid-column:2;
    text-align:left;
  }

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
NovaShop
</div>

<a href="index.html" class="back">
← Weiter einkaufen
</a>

</div>

</header>


<div class="container">

<h1>
Dein Warenkorb
</h1>


<div id="emptyCart" class="cart-box empty" style="display:none;">

<div class="empty-icon">
🛒
</div>

<h2>
Dein Warenkorb ist leer
</h2>

<p>
Füge Produkte hinzu, um sie hier zu sehen.
</p>

<a href="index.html" class="shop-button">
Zum Shop
</a>

</div>


<div id="cartContent" class="cart-layout">

<!-- ARTIKEL -->

<div class="cart-box">

<div id="cartItems"></div>

</div>


<!-- ZUSAMMENFASSUNG -->

<div class="summary">

<h2>
Zusammenfassung
</h2>

<div class="row">

<span>
Zwischensumme
</span>

<strong id="subtotal">
0,00 €
</strong>

</div>


<div class="row">

<span>
Versand
</span>

<strong id="shipping">
4,99 €
</strong>

</div>


<div class="row total">

<span>
Gesamt
</span>

<strong id="total">
0,00 €
</strong>

</div>


<div class="shipping-note" id="shippingNote">
Kostenloser Versand ab 50 €.
</div>


<button
class="checkout"
onclick="checkout()">

Zur Kasse →

</button>

</div>

</div>

</div>


<script>

/* WARENKORB LADEN */

let cart =
JSON.parse(
localStorage.getItem("cart") || "[]"
);


/* GELD FORMATIEREN */

function money(value){

return value
.toFixed(2)
.replace(".",",") + " €";

}


/* WARENKORB SPEICHERN */

function saveCart(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}


/* WARENKORB ANZEIGEN */

function renderCart(){

const cartItems =
document.getElementById("cartItems");

const cartContent =
document.getElementById("cartContent");

const emptyCart =
document.getElementById("emptyCart");


/* LEER */

if(cart.length === 0){

cartContent.style.display =
"none";

emptyCart.style.display =
"block";

return;

}


/* NICHT LEER */

cartContent.style.display =
"grid";

emptyCart.style.display =
"none";


cartItems.innerHTML =
cart.map((item,index) => {

const quantity =
item.quantity || 1;

const price =
Number(item.price) || 0;

const itemTotal =
price * quantity;


/* Größe */

const sizeText =
item.size
? `Größe: ${item.size}`
: "Keine Größenangabe";


return `

<div class="cart-item">

<img
class="cart-image"
src="${item.image}"
alt="${item.name}"
onerror="this.style.display='none';"
>


<div>

<div class="item-name">
${item.name}
</div>

<div class="item-size">
${sizeText}
</div>

<div class="item-price">
${money(price)}
</div>


<div class="quantity">

<button
onclick="changeQuantity(${index},-1)">
−
</button>

<span>
${quantity}
</span>

<button
onclick="changeQuantity(${index},1)">
+
</button>

</div>

</div>


<div class="item-right">

<div class="item-total">
${money(itemTotal)}
</div>

<button
class="remove"
onclick="removeItem(${index})">

Entfernen

</button>

</div>

</div>

`;

}).join("");


/* PREISE BERECHNEN */

const subtotal =
cart.reduce(
(sum,item) =>
sum +
(Number(item.price) || 0) *
(item.quantity || 1),
0
);


let shipping = 4.99;


/* AB 50 € VERSAND GRATIS */

if(subtotal >= 50){

shipping = 0;

}


/* GESAMT */

const total =
subtotal + shipping;


/* AUSGEBEN */

document.getElementById("subtotal")
.textContent =
money(subtotal);


document.getElementById("shipping")
.textContent =
shipping === 0
? "Kostenlos"
: money(shipping);


document.getElementById("total")
.textContent =
money(total);


/* VERSAND INFO */

const shippingNote =
document.getElementById("shippingNote");


if(shipping === 0){

shippingNote.innerHTML =
"✓ Du bekommst kostenlosen Versand.";

shippingNote.classList.add(
"shipping-free"
);

}else{

const missing =
50 - subtotal;

shippingNote.innerHTML =
`Noch ${money(missing)} bis zum kostenlosen Versand.`;

shippingNote.classList.remove(
"shipping-free"
);

}

}


/* MENGE ÄNDERN */

function changeQuantity(index,amount){

if(!cart[index]){
return;
}


cart[index].quantity =
(cart[index].quantity || 1) +
amount;


/* NICHT UNTER 1 */

if(cart[index].quantity < 1){

cart[index].quantity = 1;

}


saveCart();

}


/* PRODUKT ENTFERNEN */

function removeItem(index){

cart.splice(index,1);

saveCart();

}


/* CHECKOUT */

function checkout(){

if(cart.length === 0){

alert(
"Dein Warenkorb ist leer."
);

return;

}


window.location.href =
"checkout.html";

}


/* START */

renderCart();

</script>

</body>
</html>
