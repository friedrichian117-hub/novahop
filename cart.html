<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Warenkorb – NovaShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    /* HEADER */

    header {
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #111;
      text-decoration: none;
      font-size: 26px;
      font-weight: 900;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      text-decoration: none;
      padding: 11px 15px;
      border-radius: 10px;
      font-weight: 700;
      background: #111;
      color: white;
    }

    .nav-btn.secondary {
      background: #eee;
      color: #111;
    }

    /* MAIN */

    main {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 25px;
      align-items: start;
    }

    /* CART ITEMS */

    .cart-items {
      background: white;
      border-radius: 18px;
      border: 1px solid #e5e5e5;
      padding: 20px;
    }

    .cart-item {
      display: flex;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:first-child {
      padding-top: 0;
    }

    .cart-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .product-image {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
      flex-shrink: 0;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .item-size {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .item-price {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 15px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quantity {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .quantity button {
      width: 35px;
      height: 35px;
      border: none;
      background: #f1f1f1;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity button:hover {
      background: #ddd;
    }

    .quantity span {
      width: 38px;
      text-align: center;
      font-weight: 700;
    }

    .remove {
      border: none;
      background: none;
      color: #d00;
      cursor: pointer;
      font-weight: 700;
    }

    .remove:hover {
      text-decoration: underline;
    }

    /* SUMMARY */

    .summary {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 25px;
      position: sticky;
      top: 90px;
    }

    .summary h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      color: #555;
    }

    .summary-row.total {
      border-top: 1px solid #eee;
      padding-top: 18px;
      margin-top: 18px;
      color: #111;
      font-size: 21px;
      font-weight: 900;
    }

    .shipping-free {
      color: #168a35;
      font-weight: 800;
    }

    .shipping-paid {
      color: #111;
      font-weight: 700;
    }

    .shipping-info {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 15px;
      margin: 20px 0;
      line-height: 1.7;
      font-size: 14px;
    }

    .shipping-progress {
      background: #f1f1f1;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .checkout {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    .checkout:hover {
      background: #333;
    }

    /* EMPTY */

    .empty {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 60px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .empty p {
      color: #777;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 800;
    }

    /* FOOTER */

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 60px;
    }

    footer p {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .nav {
        flex-direction: column;
      }

      .nav-buttons {
        width: 100%;
      }

      .nav-btn {
        flex: 1;
        text-align: center;
      }

      .cart-layout {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }

    @media (max-width: 550px) {

      .cart-item {
        flex-wrap: wrap;
      }

      .product-image {
        width: 90px;
        height: 90px;
      }

      .item-info {
        min-width: calc(100% - 110px);
      }

      .item-actions {
        width: 100%;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="nav">

    <a href="index.html" class="logo">
      NovaShop
    </a>

    <div class="nav-buttons">

      <a href="index.html" class="nav-btn secondary">
        🛍️ Shop
      </a>

      <a href="orders.html" class="nav-btn">
        📦 Meine Bestellungen
      </a>

    </div>

  </div>

</header>


<main>

  <h1>🛒 Dein Warenkorb</h1>

  <p class="subtitle">
    Überprüfe deine Produkte vor dem Bezahlen.
  </p>


  <div id="cartContainer"></div>

</main>


<footer>

  <strong>NovaShop</strong>

  <p>
    © 2026 NovaShop – Alle Rechte vorbehalten.
  </p>

</footer>


<script>

function getCart() {

  return JSON.parse(
    localStorage.getItem("cart")
  ) || [];

}


function saveCart(cart) {

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}


function formatPrice(price) {

  return Number(price)
    .toFixed(2)
    .replace(".", ",") + " €";

}


function updateQuantity(index, amount) {

  const cart = getCart();

  if (!cart[index]) return;

  cart[index].quantity =
    (cart[index].quantity || 1) + amount;

  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }

  saveCart(cart);

  renderCart();

}


function removeItem(index) {

  const cart = getCart();

  cart.splice(index, 1);

  saveCart(cart);

  renderCart();

}


function checkout() {

  const cart = getCart();

  if (cart.length === 0) {

    alert("Dein Warenkorb ist leer.");

    return;

  }

  window.location.href = "checkout.html";

}


function renderCart() {

  const container =
    document.getElementById("cartContainer");

  const cart = getCart();


  if (cart.length === 0) {

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Dein Warenkorb ist leer
        </h2>

        <p>
          Entdecke unsere Produkte und finde etwas,
          das dir gefällt.
        </p>

        <a
          href="index.html"
          class="shop-btn"
        >
          Zum Shop
        </a>

      </div>

    `;

    return;

  }


  let subtotal = 0;


  cart.forEach(item => {

    subtotal +=
      Number(item.price || 0) *
      Number(item.quantity || 1);

  });


  const shipping =
    subtotal >= 50 ? 0 : 4.99;


  const total =
    subtotal + shipping;


  let shippingMessage = "";


  if (shipping === 0) {

    shippingMessage = `

      <div class="shipping-progress">
        🎉 Du hast kostenlosen Versand!
      </div>

    `;

  } else {

    const missing =
      50 - subtotal;

    shippingMessage = `

      <div class="shipping-progress">
        🎁 Noch ${formatPrice(missing)}
        bis zum kostenlosen Versand.
      </div>

    `;

  }


  let itemsHTML = "";


  cart.forEach((item, index) => {

    const quantity =
      Number(item.quantity || 1);

    const itemTotal =
      Number(item.price || 0) * quantity;


    itemsHTML += `

      <div class="cart-item">

        <img
          class="product-image"
          src="${item.image || ""}"
          alt="${item.name || "Produkt"}"
          onerror="this.style.display='none'"
        >


        <div class="item-info">

          <div class="item-name">
            ${item.name || "Produkt"}
          </div>


          ${
            item.size
            ? `
              <div class="item-size">
                Größe: ${item.size}
              </div>
            `
            : ""
          }


          <div class="item-price">
            ${formatPrice(item.price)}
          </div>


          <div class="item-actions">

            <div class="quantity">

              <button
                onclick="updateQuantity(${index}, -1)"
              >
                −
              </button>

              <span>
                ${quantity}
              </span>

              <button
                onclick="updateQuantity(${index}, 1)"
              >
                +
              </button>

            </div>


            <button
              class="remove"
              onclick="removeItem(${index})"
            >
              Entfernen
            </button>

          </div>

        </div>


        <strong>
          ${formatPrice(itemTotal)}
        </strong>

      </div>

    `;

  });


  container.innerHTML = `

    <div class="cart-layout">


      <div class="cart-items">

        ${itemsHTML}

      </div>


      <div class="summary">

        <h2>
          Bestellübersicht
        </h2>


        ${shippingMessage}


        <div class="summary-row">

          <span>
            Zwischensumme
          </span>

          <span>
            ${formatPrice(subtotal)}
          </span>

        </div>


        <div class="summary-row">

          <span>
            🚚 Versand
          </span>

          <span class="${
            shipping === 0
            ? "shipping-free"
            : "shipping-paid"
          }">

            ${
              shipping === 0
              ? "Kostenlos"
              : formatPrice(shipping)
            }

          </span>

        </div>


        <div class="shipping-info">

          🚚 <strong>Versand:</strong> 4,99 €<br>

          🎁 <strong>Kostenloser Versand</strong>
          ab 50 €<br>

          📦 <strong>Lieferzeit:</strong>
          2–4 Werktage

        </div>


        <div class="summary-row total">

          <span>
            Gesamt
          </span>

          <span>
            ${formatPrice(total)}
          </span>

        </div>


        <button
          class="checkout"
          onclick="checkout()"
        >
          Zur Kasse →
        </button>

      </div>

    </div>

  `;

}


renderCart();

</script>

</body>
</html>
