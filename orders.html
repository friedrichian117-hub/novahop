<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meine Bestellungen – NovaShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #111;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      text-decoration: none;
      padding: 11px 15px;
      border-radius: 10px;
      font-weight: 700;
      background: #111;
      color: white;
    }

    .nav-btn.secondary {
      background: #eee;
      color: #111;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .empty {
      background: white;
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      border: 1px solid #e5e5e5;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .empty p {
      color: #777;
      margin-bottom: 20px;
    }

    .shop-btn {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-weight: 700;
    }

    .order {
      background: white;
      border: 1px solid #e3e3e3;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .order-number {
      font-size: 21px;
      font-weight: 900;
    }

    .order-date {
      color: #777;
      margin-top: 5px;
      font-size: 14px;
    }

    .order-total {
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* STATUS */

    .status-box {
      background: #f8f8f8;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 25px;
    }

    .status-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .status {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
    }

    .status-line {
      position: absolute;
      top: 15px;
      left: 8%;
      right: 8%;
      height: 3px;
      background: #ddd;
      z-index: 0;
    }

    .status-progress {
      position: absolute;
      top: 15px;
      left: 8%;
      height: 3px;
      background: #111;
      z-index: 1;
      transition: width 0.3s;
    }

    .status-step {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 25%;
    }

    .status-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
    }

    .status-step.active .status-icon {
      background: #111;
      color: white;
    }

    .status-step.current .status-icon {
      box-shadow: 0 0 0 5px #e5e5e5;
    }

    .status-label {
      font-size: 12px;
      color: #777;
      font-weight: 700;
    }

    .status-step.active .status-label {
      color: #111;
    }

    /* PRODUCTS */

    .products {
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .product:last-child {
      border-bottom: none;
    }

    .product img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .product-details {
      color: #777;
      font-size: 14px;
    }

    .product-price {
      font-weight: 800;
    }

    .summary {
      border-top: 1px solid #eee;
      margin-top: 15px;
      padding-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 7px 0;
      color: #555;
    }

    .summary-row.total {
      color: #111;
      font-size: 19px;
      font-weight: 900;
      margin-top: 12px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 50px;
    }

    footer p {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    @media (max-width: 700px) {

      .nav {
        flex-direction: column;
      }

      .nav-buttons {
        width: 100%;
      }

      .nav-btn {
        flex: 1;
        text-align: center;
      }

      .order {
        padding: 18px;
      }

      .order-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .order-total {
        font-size: 18px;
      }

      .status-box {
        padding: 15px 8px;
      }

      .status-label {
        font-size: 10px;
      }

      .status-icon {
        width: 28px;
        height: 28px;
        font-size: 13px;
      }

      .status-line,
      .status-progress {
        top: 13px;
      }

      .product img {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="nav">

    <a href="index.html" class="logo">
      NovaShop
    </a>

    <div class="nav-buttons">

      <a href="index.html" class="nav-btn secondary">
        🛍️ Shop
      </a>

      <a href="cart.html" class="nav-btn">
        🛒 Warenkorb
      </a>

    </div>

  </div>

</header>


<main>

  <h1>📦 Meine Bestellungen</h1>

  <p class="subtitle">
    Hier kannst du deine bisherigen Bestellungen und deren Status sehen.
  </p>


  <div id="orders"></div>

</main>


<footer>

  <strong>NovaShop</strong>

  <p>
    © 2026 NovaShop – Alle Rechte vorbehalten.
  </p>

</footer>


<script>

const ordersContainer = document.getElementById("orders");

let orders = JSON.parse(
  localStorage.getItem("orders")
) || [];


/*
  STATUS:

  0 = Bestellung eingegangen
  1 = Wird bearbeitet
  2 = Versandt
  3 = Zugestellt

  Bei neuen Bestellungen starten sie automatisch
  bei Status 0.
*/

function getStatus(order) {

  if (typeof order.status === "number") {
    return order.status;
  }

  return 0;

}


function formatPrice(price) {

  return Number(price)
    .toFixed(2)
    .replace(".", ",") + " €";

}


function formatDate(date) {

  if (!date) {
    return "Datum unbekannt";
  }

  const d = new Date(date);

  if (isNaN(d.getTime())) {
    return date;
  }

  return d.toLocaleDateString("de-DE", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });

}


function getShipping(order) {

  if (typeof order.shipping === "number") {
    return order.shipping;
  }

  return Number(order.subtotal || 0) >= 50 ? 0 : 4.99;

}


function renderStatus(status) {

  const labels = [
    "Bestellung eingegangen",
    "Wird bearbeitet",
    "Versandt",
    "Zugestellt"
  ];

  const icons = [
    "✓",
    "⚙",
    "🚚",
    "✓"
  ];

  let progress = 0;

  if (status === 1) {
    progress = 29;
  }

  if (status === 2) {
    progress = 62;
  }

  if (status === 3) {
    progress = 84;
  }


  let html = `

    <div class="status-box">

      <div class="status-title">
        Bestellstatus
      </div>

      <div class="status">

        <div class="status-line"></div>

        <div
          class="status-progress"
          style="width:${progress}%"
        ></div>

  `;


  labels.forEach((label, index) => {

    const active = index <= status;

    const current = index === status;

    html += `

      <div
        class="status-step
        ${active ? "active" : ""}
        ${current ? "current" : ""}"
      >

        <div class="status-icon">
          ${active ? icons[index] : ""}
        </div>

        <div class="status-label">
          ${label}
        </div>

      </div>

    `;

  });


  html += `

      </div>

    </div>

  `;


  return html;

}


function renderOrders() {

  if (orders.length === 0) {

    ordersContainer.innerHTML = `

      <div class="empty">

        <h2>Noch keine Bestellungen</h2>

        <p>
          Du hast bisher noch keine Bestellung aufgegeben.
        </p>

        <a href="index.html" class="shop-btn">
          Jetzt shoppen
        </a>

      </div>

    `;

    return;

  }


  /*
    Neueste Bestellung zuerst
  */

  orders = [...orders].reverse();


  ordersContainer.innerHTML = "";


  orders.forEach(order => {

    const status = getStatus(order);

    const products = order.items || order.products || [];

    const subtotal = Number(
      order.subtotal || 0
    );

    const shipping = getShipping(order);

    const total = Number(
      order.total || subtotal + shipping
    );


    let productsHTML = "";


    products.forEach(product => {

      productsHTML += `

        <div class="product">

          <img
            src="${product.image || ""}"
            alt="${product.name || "Produkt"}"
          >

          <div class="product-info">

            <div class="product-name">
              ${product.name || "Produkt"}
            </div>

            <div class="product-details">

              ${
                product.size
                ? "Größe: " + product.size + " · "
                : ""
              }

              Menge: ${product.quantity || 1}

            </div>

          </div>

          <div class="product-price">

            ${formatPrice(
              Number(product.price || 0) *
              Number(product.quantity || 1)
            )}

          </div>

        </div>

      `;

    });


    ordersContainer.innerHTML += `

      <div class="order">

        <div class="order-header">

          <div>

            <div class="order-number">
              Bestellung ${order.orderNumber || "NovaShop"}
            </div>

            <div class="order-date">
              ${formatDate(order.date)}
            </div>

          </div>

          <div class="order-total">
            ${formatPrice(total)}
          </div>

        </div>


        ${renderStatus(status)}


        <div class="products">

          ${productsHTML}

        </div>


        <div class="summary">

          <div class="summary-row">

            <span>Zwischensumme</span>

            <span>
              ${formatPrice(subtotal)}
            </span>

          </div>


          <div class="summary-row">

            <span>Versand</span>

            <span>
              ${
                shipping === 0
                ? "Kostenlos"
                : formatPrice(shipping)
              }
            </span>

          </div>


          <div class="summary-row total">

            <span>Gesamt</span>

            <span>
              ${formatPrice(total)}
            </span>

          </div>

        </div>

      </div>

    `;

  });

}


renderOrders();

</script>

</body>
</html>
