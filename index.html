<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaShop</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f6;
  color:#111;
}

.top{
  background:#111;
  color:white;
  text-align:center;
  padding:10px;
  font-size:13px;
}

header{
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:900;
}

.cartBtn{
  background:#111;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.hero{
  max-width:1200px;
  margin:25px auto;
  padding:60px 35px;
  background:#111;
  color:white;
  border-radius:18px;
}

.hero h1{
  font-size:48px;
  margin:0 0 12px;
}

.hero p{
  color:#ccc;
  font-size:17px;
}

.hero button{
  padding:13px 20px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:0 20px 50px;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.filter{
  background:white;
  border:1px solid #ccc;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

.filter.active{
  background:#111;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  background:white;
  border:1px solid #e1e1e1;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.image{
  height:300px;
  position:relative;
  background:#eee;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.badge{
  position:absolute;
  top:12px;
  left:12px;
  background:#111;
  color:white;
  padding:6px 9px;
  border-radius:6px;
  font-size:11px;
  font-weight:bold;
}

.info{
  padding:15px;
}

.info h3{
  margin:0 0 8px;
}

.stars{
  font-size:13px;
  margin-bottom:8px;
}

.price{
  font-size:18px;
  font-weight:bold;
}

.add{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#111;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

footer{
  background:#111;
  color:#aaa;
  text-align:center;
  padding:30px;
}

/* WARENKORB */

.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  z-index:50;
}

.drawer.open{
  display:block;
}

.cartPanel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:420px;
  max-width:95%;
  background:white;
  padding:25px;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}

.cartItem{
  display:flex;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #ddd;
}

.cartItem img{
  width:70px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
}

.remove{
  margin-top:8px;
  border:0;
  padding:6px 9px;
  border-radius:6px;
  cursor:pointer;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){
  .products{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="top">
Kostenloser Versand ab 50 € · Neue Styles im Shop
</div>

<header>
<div class="nav">

<div class="logo">
NovaShop
</div>

<button class="cartBtn" onclick="openCart()">
🛒 Warenkorb (<span id="count">0</span>)
</button>

</div>
</header>


<section class="hero">

<h1>
Dein Style. Deine Auswahl.
</h1>

<p>
Moderne Hoodies und ausgewählte Technik – einfach online bestellen.
</p>

<button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
Shop entdecken
</button>

</section>


<div class="container">

<div class="filters">

<button class="filter active" onclick="filterProducts('Alle',this)">
Alle
</button>

<button class="filter" onclick="filterProducts('Hoodies',this)">
Hoodies
</button>

<button class="filter" onclick="filterProducts('Elektronik',this)">
Elektronik
</button>

</div>


<div id="products" class="products"></div>

</div>


<footer>
© 2026 NovaShop · Alle Rechte vorbehalten
</footer>


<!-- WARENKORB -->

<div id="drawer" class="drawer" onclick="closeCart()">

<div class="cartPanel" onclick="event.stopPropagation()">

<button class="close" onclick="closeCart()">×</button>

<h2>Dein Warenkorb</h2>

<div id="cartItems"></div>

<h3 id="total"></h3>

</div>

</div>


<script>

const products = [

{
id:1,
name:"Nova Black Hoodie",
price:39.99,
category:"Hoodies",
badge:"BESTSELLER",
sizes:["XS","S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85"
]
},

{
id:2,
name:"Nova Grey Hoodie",
price:44.99,
category:"Hoodies",
badge:"NEU",
sizes:["XS","S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85"
]
},

{
id:3,
name:"Nova Streetwear Hoodie",
price:49.99,
category:"Hoodies",
badge:"TREND",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1611312449412-6cefac5dc3e4?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85"
]
},

{
id:4,
name:"Nova Cream Hoodie",
price:39.99,
category:"Hoodies",
badge:"",
sizes:["XS","S","M","L","XL"],
images:[
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=900&q=85"
]
},

{
id:5,
name:"Nova Green Hoodie",
price:44.99,
category:"Hoodies",
badge:"NEU",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1618354691373-d851c5c3c990?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85"
]
},

{
id:6,
name:"Nova Zip Hoodie",
price:54.99,
category:"Hoodies",
badge:"PREMIUM",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85"
]
},

{
id:7,
name:"Nova Wireless Headphones",
price:59.99,
category:"Elektronik",
badge:"TOP",
sizes:[],
images:[
"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&w=900&q=85"
]
},

{
id:8,
name:"Nova Smartwatch",
price:79.99,
category:"Elektronik",
badge:"NEU",
sizes:[],
images:[
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=900&q=85"
]
}

];


let cart = JSON.parse(localStorage.getItem("novaCart") || "[]");


function render(list = products){

document.getElementById("products").innerHTML = list.map(p => `

<div class="card" onclick="openProduct(${p.id})">

<div class="image">

<img src="${p.images[0]}" alt="${p.name}">

${p.badge ? `<span class="badge">${p.badge}</span>` : ""}

</div>

<div class="info">

<h3>${p.name}</h3>

<div class="stars">
★★★★★
</div>

<div class="price">
${p.price.toFixed(2).replace(".",",")} €
</div>

<button
class="add"
onclick="event.stopPropagation(); addToCart(${p.id})">
In den Warenkorb
</button>

</div>

</div>

`).join("");

}


function openProduct(id){

window.location.href = "product.html?id=" + id;

}


function filterProducts(category,button){

document.querySelectorAll(".filter")
.forEach(x => x.classList.remove("active"));

button.classList.add("active");

if(category === "Alle"){

render(products);

}else{

render(
products.filter(p => p.category === category)
);

}

}


function addToCart(id){

const product = products.find(p => p.id === id);

cart.push({

id:product.id,
name:product.name,
price:product.price,
image:product.images[0]

});

saveCart();

openCart();

}


function saveCart(){

localStorage.setItem(
"novaCart",
JSON.stringify(cart)
);

updateCart();

}


function updateCart(){

document.getElementById("count").textContent =
cart.length;


document.getElementById("cartItems").innerHTML =

cart.length ?

cart.map((item,index) => `

<div class="cartItem">

<img src="${item.image}">

<div>

<strong>${item.name}</strong>

<br>

${item.price.toFixed(2).replace(".",",")} €

<br>

<button
class="remove"
onclick="removeItem(${index})">
Entfernen
</button>

</div>

</div>

`).join("")

:

"<p>Dein Warenkorb ist leer.</p>";


const sum = cart.reduce(
(total,item) => total + item.price,
0
);

document.getElementById("total").textContent =
"Gesamt: " +
sum.toFixed(2).replace(".",",") +
" €";

}


function removeItem(index){

cart.splice(index,1);

saveCart();

}


function openCart(){

document.getElementById("drawer")
.classList.add("open");

updateCart();

}


function closeCart(){

document.getElementById("drawer")
.classList.remove("open");

}


render();

updateCart();

</script>

</body>
</html>
