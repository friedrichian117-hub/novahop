<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaShop – Produkt</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f6;
  color:#111;
}

/* HEADER */

header{
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:900;
}

.nav-buttons{
  display:flex;
  gap:10px;
}

.nav-btn{
  background:#111;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

/* PRODUKT */

.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px 60px;
}

.product{
  background:white;
  border-radius:18px;
  padding:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

/* BILDER */

.gallery{
  width:100%;
}

.main-image{
  width:100%;
  height:560px;
  object-fit:cover;
  border-radius:14px;
  display:block;
  background:#eee;
}

.thumbnails{
  display:flex;
  gap:10px;
  margin-top:12px;
  overflow-x:auto;
}

.thumbnail{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:9px;
  cursor:pointer;
  border:2px solid transparent;
}

.thumbnail:hover{
  border-color:#111;
}

.thumbnail.active{
  border-color:#111;
}

/* PRODUKT INFO */

.info{
  padding:10px 0;
}

.badge{
  display:inline-block;
  background:#111;
  color:white;
  padding:7px 10px;
  border-radius:6px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  font-size:40px;
  margin:0 0 12px;
}

.stars{
  font-size:14px;
  margin-bottom:18px;
}

.description{
  color:#666;
  line-height:1.6;
  margin-bottom:25px;
}

.price{
  font-size:30px;
  font-weight:900;
  margin-bottom:28px;
}

/* GRÖSSEN */

.option-title{
  font-weight:bold;
  margin-bottom:12px;
}

.sizes{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:28px;
}

.size{
  min-width:55px;
  padding:13px 16px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.size:hover{
  border-color:#111;
}

.size.selected{
  background:#111;
  color:white;
  border-color:#111;
}

/* MENGE */

.quantity{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.quantity button{
  width:38px;
  height:38px;
  background:white;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:pointer;
  font-size:20px;
}

.quantity span{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}

/* WARENKORB */

.add{
  width:100%;
  background:#111;
  color:white;
  border:0;
  padding:17px;
  border-radius:9px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
}

.add:hover{
  background:#292929;
}

.back{
  display:block;
  margin-top:20px;
  color:#555;
  text-decoration:none;
}

.back:hover{
  text-decoration:underline;
}

/* INFO */

.shipping-info{
  margin-top:20px;
  padding:15px;
  background:#f6f6f6;
  border-radius:10px;
  color:#555;
  font-size:14px;
  line-height:1.6;
}

/* MOBILE */

@media(max-width:850px){

  .product{
    grid-template-columns:1fr;
    padding:20px;
    gap:25px;
  }

  .main-image{
    height:450px;
  }

  h1{
    font-size:32px;
  }

}

@media(max-width:500px){

  .main-image{
    height:350px;
  }

  .nav{
    padding:15px;
  }

  .logo{
    font-size:22px;
  }

  .nav-btn{
    padding:9px 12px;
    font-size:13px;
  }

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
NovaShop
</div>

<div class="nav-buttons">

<a href="index.html" class="nav-btn">
← Shop
</a>

<a href="cart.html" class="nav-btn">
🛒 Warenkorb
</a>

</div>

</div>

</header>


<div class="container">

<div class="product">

<!-- BILDER -->

<div class="gallery">

<img
id="mainImage"
class="main-image"
src=""
alt="Produktbild"
>

<div
id="thumbnails"
class="thumbnails">
</div>

</div>


<!-- PRODUKT INFORMATIONEN -->

<div class="info">

<span
id="badge"
class="badge"
style="display:none;">
</span>

<h1 id="productName">
Produkt
</h1>

<div class="stars">
★★★★★
</div>

<p
id="description"
class="description">
</p>

<div
id="price"
class="price">
</div>


<!-- GRÖSSEN -->

<div
id="sizeSection">

<div class="option-title">
Größe auswählen
</div>

<div
id="sizes"
class="sizes">
</div>

</div>


<!-- MENGE -->

<div class="option-title">
Menge
</div>

<div class="quantity">

<button onclick="changeQuantity(-1)">
−
</button>

<span id="quantity">
1
</span>

<button onclick="changeQuantity(1)">
+
</button>

</div>


<!-- WARENKORB -->

<button
class="add"
onclick="addToCart()">

In den Warenkorb 🛒

</button>


<div class="shipping-info">

✓ Sicher bestellen<br>
✓ Kostenloser Versand ab 50 €<br>
✓ Einfache Rückgabe

</div>


<a
href="index.html"
class="back">

← Zurück zum Shop

</a>

</div>

</div>

</div>


<script>

/* =====================================================
   PRODUKTE
   EXAKT DIE GLEICHEN PRODUKTE WIE IN DEINER INDEX.HTML
   ===================================================== */

const products = [

{
id:1,
name:"Nova Black Hoodie",
price:39.99,
category:"Hoodies",
badge:"BESTSELLER",
sizes:["XS","S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85"
]
},

{
id:2,
name:"Nova Grey Hoodie",
price:44.99,
category:"Hoodies",
badge:"NEU",
sizes:["XS","S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85"
]
},

{
id:3,
name:"Nova Streetwear Hoodie",
price:49.99,
category:"Hoodies",
badge:"TREND",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1611312449412-6cefac5dc3e4?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85"
]
},

{
id:4,
name:"Nova Cream Hoodie",
price:39.99,
category:"Hoodies",
badge:"",
sizes:["XS","S","M","L","XL"],
images:[
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=900&q=85"
]
},

{
id:5,
name:"Nova Green Hoodie",
price:44.99,
category:"Hoodies",
badge:"NEU",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1618354691373-d851c5c3c990?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85"
]
},

{
id:6,
name:"Nova Zip Hoodie",
price:54.99,
category:"Hoodies",
badge:"PREMIUM",
sizes:["S","M","L","XL","XXL"],
images:[
"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=900&q=85"
]
},

{
id:7,
name:"Nova Wireless Headphones",
price:59.99,
category:"Elektronik",
badge:"TOP",
sizes:[],
images:[
"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&w=900&q=85"
]
},

{
id:8,
name:"Nova Smartwatch",
price:79.99,
category:"Elektronik",
badge:"NEU",
sizes:[],
images:[
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=85",
"https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?auto=format&fit=crop&w=900&q=85"
]
}

];


/* =====================================================
   PRODUKT-ID AUS DER URL
   ===================================================== */

const urlParams =
new URLSearchParams(window.location.search);

const productId =
Number(urlParams.get("id"));


/* Passendes Produkt suchen */

const product =
products.find(p => p.id === productId);


/* Falls keine Produkt-ID gefunden wurde */

if(!product){

document.body.innerHTML = `

<div style="
font-family:Arial;
text-align:center;
padding:80px 20px;
">

<h1>Produkt nicht gefunden</h1>

<p>
Das Produkt konnte nicht geladen werden.
</p>

<a href="index.html">
← Zurück zum Shop
</a>

</div>

`;

}else{

loadProduct();

}


/* =====================================================
   PRODUKT LADEN
   ===================================================== */

function loadProduct(){

/* Name */

document.getElementById("productName")
.textContent = product.name;


/* Beschreibung */

document.getElementById("description")
.textContent =
"Entdecke " +
product.name +
" von NovaShop. Modernes Design und hochwertige Verarbeitung für deinen Alltag.";


/* Preis */

document.getElementById("price")
.textContent =
product.price.toFixed(2).replace(".",",") +
" €";


/* Badge */

const badge =
document.getElementById("badge");

if(product.badge){

badge.textContent =
product.badge;

badge.style.display =
"inline-block";

}


/* Hauptbild */

const mainImage =
document.getElementById("mainImage");

mainImage.src =
product.images[0];


/* Thumbnails */

const thumbnails =
document.getElementById("thumbnails");

thumbnails.innerHTML = "";


product.images.forEach(
(image,index) => {

const img =
document.createElement("img");

img.src = image;

img.className =
"thumbnail";

if(index === 0){

img.classList.add("active");

}

img.onclick = function(){

mainImage.src =
image;

document
.querySelectorAll(".thumbnail")
.forEach(x =>
x.classList.remove("active")
);

img.classList.add("active");

};

thumbnails.appendChild(img);

});


/* =====================================================
   GRÖSSEN
   ===================================================== */

const sizeSection =
document.getElementById("sizeSection");

const sizesContainer =
document.getElementById("sizes");


/* Elektronik hat keine Größen */

if(product.sizes.length === 0){

sizeSection.style.display =
"none";

}else{

sizeSection.style.display =
"block";

sizesContainer.innerHTML = "";


product.sizes.forEach(
size => {

const button =
document.createElement("button");

button.type =
"button";

button.className =
"size";

button.textContent =
size;


button.onclick = function(){

/* Alle anderen abwählen */

document
.querySelectorAll(".size")
.forEach(
x => x.classList.remove("selected")
);


/* Diese Größe auswählen */

button.classList.add("selected");


/* Speichern */

selectedSize =
size;

};

sizesContainer.appendChild(
button
);

});

}

}


/* =====================================================
   AUSGEWÄHLTE GRÖSSE
   ===================================================== */

let selectedSize = "";


/* =====================================================
   MENGE
   ===================================================== */

let quantity = 1;


function changeQuantity(amount){

quantity += amount;


if(quantity < 1){

quantity = 1;

}


document.getElementById("quantity")
.textContent =
quantity;

}


/* =====================================================
   IN WARENKORB
   ===================================================== */

function addToCart(){

/* Bei Kleidung muss Größe gewählt werden */

if(
product.sizes.length > 0 &&
selectedSize === ""
){

alert(
"Bitte wähle zuerst eine Größe aus."
);

return;

}


/* Bestehenden Warenkorb laden */

let cart =
JSON.parse(
localStorage.getItem("cart") ||
"[]"
);


/* Prüfen, ob dasselbe Produkt
   mit derselben Größe bereits existiert */

const existing =
cart.find(item =>
item.id === product.id &&
item.size === selectedSize
);


/* Wenn vorhanden → Menge erhöhen */

if(existing){

existing.quantity =
(existing.quantity || 1) +
quantity;

}else{

/* Neues Produkt */

cart.push({

id:product.id,

name:product.name,

price:product.price,

image:product.images[0],

size:selectedSize,

quantity:quantity

});

}


/* Warenkorb speichern */

localStorage.setItem(
"cart",
JSON.stringify(cart)
);


/* Zum Warenkorb */

window.location.href =
"cart.html";

}

</script>

</body>
</html>
