<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout – NovaShop</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f7f9;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:800;
}

header a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  font-weight:600;
}

.container{
  max-width:1150px;
  margin:40px auto;
  padding:0 20px;
}

h1{
  font-size:34px;
  margin-bottom:30px;
}

.layout{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:25px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.card h2{
  font-size:21px;
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:600;
  margin:15px 0 7px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus,select:focus{
  border-color:#111827;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.payment-option{
  border:1px solid #d1d5db;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
}

.payment-option:hover{
  border-color:#111827;
}

.payment-option input{
  width:auto;
  margin-right:8px;
}

.summary-item{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
}

.divider{
  border-top:1px solid #e5e7eb;
  margin:18px 0;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:800;
}

.shipping-box{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:15px;
  border-radius:10px;
  margin-top:18px;
  line-height:1.6;
}

.order-btn{
  width:100%;
  background:#111827;
  color:white;
  border:none;
  padding:16px;
  border-radius:10px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-top:20px;
}

.order-btn:hover{
  background:#000;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#111827;
  text-decoration:none;
  font-weight:600;
}

.success{
  text-align:center;
  padding:60px 20px;
}

.success-icon{
  font-size:60px;
  margin-bottom:20px;
}

.success h2{
  font-size:30px;
  margin-bottom:12px;
}

.success p{
  color:#6b7280;
  margin-bottom:25px;
}

.success a{
  display:inline-block;
  background:#111827;
  color:white;
  padding:13px 20px;
  border-radius:9px;
  text-decoration:none;
  margin:5px;
  font-weight:600;
}

.empty{
  text-align:center;
  padding:50px 20px;
}

.empty a{
  display:inline-block;
  margin-top:20px;
  background:#111827;
  color:white;
  padding:13px 20px;
  border-radius:9px;
  text-decoration:none;
}

footer{
  margin-top:60px;
  background:#111827;
  color:#d1d5db;
  padding:30px 6%;
  text-align:center;
  line-height:1.8;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .row{
    grid-template-columns:1fr;
  }

  h1{
    font-size:28px;
  }

  header{
    padding:16px 20px;
  }

  header a{
    margin-left:10px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">NovaShop</div>

  <div>
    <a href="index.html">Shop</a>
    <a href="cart.html">🛒 Warenkorb</a>
    <a href="orders.html">📦 Bestellungen</a>
  </div>
</header>

<div class="container">

  <a class="back" href="cart.html">← Zurück zum Warenkorb</a>

  <h1>Checkout</h1>

  <div id="checkoutContent"></div>

</div>

<footer>
  <strong>NovaShop</strong><br>
  🚚 Versand: 4,99 €<br>
  🎁 Kostenloser Versand ab 50 €<br>
  📦 Lieferzeit: 2–4 Werktage
</footer>

<script>

const cart = JSON.parse(localStorage.getItem("cart")) || [];

const checkoutContent = document.getElementById("checkoutContent");

function money(value){
  return value.toFixed(2).replace(".",",") + " €";
}

if(cart.length === 0){

  checkoutContent.innerHTML = `
    <div class="card empty">
      <h2>Dein Warenkorb ist leer.</h2>
      <p>Füge zuerst Produkte hinzu, bevor du zur Kasse gehst.</p>
      <a href="index.html">Zum Shop</a>
    </div>
  `;

}else{

  let subtotal = 0;

  cart.forEach(item=>{
    subtotal += item.price * item.quantity;
  });

  const shipping = subtotal >= 50 ? 0 : 4.99;
  const total = subtotal + shipping;

  checkoutContent.innerHTML = `

    <div class="layout">

      <div>

        <div class="card">

          <h2>📍 Lieferadresse</h2>

          <div class="row">

            <div>
              <label>Vorname</label>
              <input id="firstName" type="text" placeholder="Max">
            </div>

            <div>
              <label>Nachname</label>
              <input id="lastName" type="text" placeholder="Mustermann">
            </div>

          </div>

          <label>E-Mail-Adresse</label>
          <input id="email" type="email" placeholder="deine@email.de">

          <label>Straße & Hausnummer</label>
          <input id="street" type="text" placeholder="Musterstraße 12">

          <div class="row">

            <div>
              <label>PLZ</label>
              <input id="zip" type="text" placeholder="70173">
            </div>

            <div>
              <label>Ort</label>
              <input id="city" type="text" placeholder="Stuttgart">
            </div>

          </div>

          <label>Land</label>

          <select id="country">
            <option value="">Land auswählen</option>
            <option>Deutschland</option>
            <option>Österreich</option>
            <option>Schweiz</option>
          </select>

        </div>


        <div class="card">

          <h2>💳 Zahlungsmethode</h2>

          <label class="payment-option">
            <input type="radio" name="payment" value="card">
            💳 Kreditkarte
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="paypal">
            🅿️ PayPal
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="klarna">
            🟠 Klarna
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" value="cash">
            💶 Zahlung auf Rechnung
          </label>

          <button class="order-btn" id="orderButton">
            Jetzt bestellen · ${money(total)}
          </button>

        </div>

      </div>


      <div>

        <div class="card">

          <h2>🛍️ Deine Bestellung</h2>

          <div id="items"></div>

          <div class="divider"></div>

          <div class="summary-item">
            <span>Zwischensumme</span>
            <strong>${money(subtotal)}</strong>
          </div>

          <div class="summary-item">
            <span>Versand</span>
            <strong>
              ${shipping === 0 ? "Kostenlos" : money(shipping)}
            </strong>
          </div>

          <div class="divider"></div>

          <div class="total">
            <span>Gesamt</span>
            <span>${money(total)}</span>
          </div>

          <div class="shipping-box">

            <strong>🚚 Versandinformationen</strong><br>

            ${shipping === 0
              ? "🎉 Du erhältst kostenlosen Versand!"
              : "Versandkosten: 4,99 €"
            }

            <br>
            🎁 Kostenlos ab 50 €
            <br>
            📦 Lieferzeit: 2–4 Werktage

          </div>

        </div>

      </div>

    </div>
  `;


  const items = document.getElementById("items");

  cart.forEach(item=>{

    items.innerHTML += `

      <div class="summary-item">

        <span>
          ${item.name}<br>
          <small>
            ${item.size ? "Größe: " + item.size + " · " : ""}
            Menge: ${item.quantity}
          </small>
        </span>

        <strong>
          ${money(item.price * item.quantity)}
        </strong>

      </div>

    `;

  });


  document.getElementById("orderButton").addEventListener("click",()=>{

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim();
    const street = document.getElementById("street").value.trim();
    const zip = document.getElementById("zip").value.trim();
    const city = document.getElementById("city").value.trim();
    const country = document.getElementById("country").value;

    const payment = document.querySelector(
      'input[name="payment"]:checked'
    );


    if(
      !firstName ||
      !lastName ||
      !email ||
      !street ||
      !zip ||
      !city ||
      !country
    ){

      alert("Bitte fülle alle Lieferdaten aus.");
      return;

    }


    if(!email.includes("@")){

      alert("Bitte gib eine gültige E-Mail-Adresse ein.");
      return;

    }


    if(!payment){

      alert("Bitte wähle eine Zahlungsmethode aus.");
      return;

    }


    const orderNumber =
      "NS-" +
      Math.floor(100000 + Math.random() * 900000);


    const order = {

      id: orderNumber,

      date: new Date().toLocaleString("de-DE"),

      customer:{
        firstName,
        lastName,
        email,
        street,
        zip,
        city,
        country
      },

      payment: payment.value,

      products: cart,

      subtotal: subtotal,

      shipping: shipping,

      total: total,

      status: 0

    };


    const orders =
      JSON.parse(localStorage.getItem("orders")) || [];

    orders.unshift(order);

    localStorage.setItem(
      "orders",
      JSON.stringify(orders)
    );

    localStorage.setItem(
      "lastOrder",
      JSON.stringify(order)
    );

    localStorage.removeItem("cart");


    checkoutContent.innerHTML = `

      <div class="card success">

        <div class="success-icon">✅</div>

        <h2>Bestellung erfolgreich!</h2>

        <p>
          Vielen Dank für deine Bestellung bei NovaShop.
        </p>

        <p>
          Deine Bestellnummer:
          <strong>${orderNumber}</strong>
        </p>

        <p>
          Gesamtbetrag:
          <strong>${money(total)}</strong>
        </p>

        <a href="orders.html">
          📦 Meine Bestellung ansehen
        </a>

        <a href="index.html">
          🛍️ Zurück zum Shop
        </a>

      </div>

    `;

  });

}

</script>

</body>
</html>
